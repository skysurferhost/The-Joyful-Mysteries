#ssAudioPlay:hover{background:rgba(255,255,255,.08)!important;border-color:rgba(255,255,255,.48)!important}
.ss-audio-play-icon{width:0;height:0;border-left:13px solid rgba(255,255,255,.96);border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.ss-audio-pause-icon{display:flex;gap:4px}.ss-audio-pause-icon i{display:block;width:5px;height:16px;background:rgba(255,255,255,.96)}
.ss-audio-timeline{width:120px;height:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:999px;cursor:pointer;position:relative;overflow:hidden}.ss-audio-progress{height:100%;width:0;background:rgba(255,255,255,.92);border-radius:999px;pointer-events:none}.ss-audio-marker{position:absolute;top:-4px;width:2px;height:16px;background:rgba(255,255,255,.35);pointer-events:none}
.ss-audio-volume-wrap{position:relative;width:34px;height:34px;flex:0 0 auto}.ss-audio-volume-slider{position:absolute;right:0;top:42px;width:120px;display:none;accent-color:#fff}.ss-audio-volume-wrap.open .ss-audio-volume-slider{display:block}
.ss-audio-volume-icon{width:18px;height:18px;fill:rgba(255,255,255,.96);display:block}
.ss-audio-handle{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 10px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);cursor:pointer;white-space:nowrap;color:#fff}.ss-audio-dots{font-size:12px;letter-spacing:1px;opacity:.9;color:#fff}.ss-audio-label{font-size:14px;font-weight:500;opacity:1;letter-spacing:.2px;color:#fff!important}
@media(max-width:768px){.ss-audio-player{left:50%;right:auto;transform:translateX(-50%);top:70px}.ss-audio-row{justify-content:center}.ss-audio-timeline{width:105px}}

<script id="skySurferAudioPlayerScript">
(function(){'use strict';var tracks=["music/track-01.mp3","music/track-02.mp3","music/track-03.mp3","music/track-04.mp3","music/track-05.mp3"];var audio=document.getElementById('ssAudio'),player=document.getElementById('ssAudioPlayer'),playBtn=document.getElementById('ssAudioPlay'),playIcon=document.getElementById('ssAudioPlayIcon'),timeline=document.getElementById('ssAudioTimeline'),progress=document.getElementById('ssAudioProgress'),volumeWrap=document.getElementById('ssAudioVolumeWrap'),volumeBtn=document.getElementById('ssAudioVolumeBtn'),volume=document.getElementById('ssAudioVolume'),wave1=document.getElementById('ssAudioWave1'),wave2=document.getElementById('ssAudioWave2'),handle=document.getElementById('ssAudioHandle');var durations=[],offsets=[],total=0,index=0,dragging=false,autoplayNext=false,interacted=false,rememberedVolume=1;
function setPlay(){playIcon.className='ss-audio-play-icon';playIcon.innerHTML=''}function setPause(){playIcon.className='ss-audio-pause-icon';playIcon.innerHTML='<i></i><i></i>'}function updateVolumeIcon(){var v=rememberedVolume;wave2.style.display=v<.4?'none':'';wave1.style.display=v<.2?'none':''}function applyVolume(){audio.volume=rememberedVolume;volume.value=String(rememberedVolume);updateVolumeIcon()}function load(i,autoplay){index=i;audio.src=tracks[i];audio.load();applyVolume();if(autoplay){audio.play().then(setPause).catch(setPlay)}else setPlay()}function playPause(){interacted=true;if(audio.paused){autoplayNext=true;audio.play().then(setPause).catch(function(){})}else{autoplayNext=false;audio.pause();setPlay()}}
function seek(clientX){if(!total)return;var r=timeline.getBoundingClientRect(),pct=Math.max(0,Math.min(1,(clientX-r.left)/r.width)),target=pct*total,i=offsets.findIndex(function(o,j){return target<o+durations[j]});if(i<0)i=tracks.length-1;var wasPlaying=!audio.paused;autoplayNext=wasPlaying;load(i,wasPlaying);audio.currentTime=Math.max(0,target-offsets[i])}
Promise.all(tracks.map(function(src){return new Promise(function(resolve){var a=new Audio(src);a.onloadedmetadata=function(){resolve(Number.isFinite(a.duration)?a.duration:0)};a.onerror=function(){resolve(0)}})})).then(function(times){durations=times;offsets=times.map(function(_,i){return times.slice(0,i).reduce(function(a,b){return a+b},0)});total=times.reduce(function(a,b){return a+b},0);offsets.forEach(function(o,i){if(i===0||!total)return;var m=document.createElement('span');m.className='ss-audio-marker';m.style.left=((o/total)*100)+'%';timeline.appendChild(m)});applyVolume();load(0,false)});
audio.addEventListener('timeupdate',function(){if(!total)return;var global=(offsets[index]||0)+audio.currentTime;progress.style.width=((global/total)*100)+'%'});audio.addEventListener('ended',function(){if(index<tracks.length-1)load(index+1,autoplayNext);else{autoplayNext=false;setPlay()}});playBtn.addEventListener('click',function(e){e.stopPropagation();playPause()});handle.addEventListener('click',function(e){e.stopPropagation();player.classList.toggle('ss-audio-collapsed');volumeWrap.classList.remove('open')});volumeBtn.addEventListener('click',function(e){e.stopPropagation();volumeWrap.classList.toggle('open')});volume.addEventListener('input',function(e){e.stopPropagation();rememberedVolume=Math.max(0,Math.min(1,Number(volume.value)));applyVolume()});
timeline.addEventListener('mousedown',function(e){e.stopPropagation();dragging=true;seek(e.clientX)});window.addEventListener('mousemove',function(e){if(dragging)seek(e.clientX)});window.addEventListener('mouseup',function(){dragging=false});timeline.addEventListener('touchstart',function(e){e.stopPropagation();dragging=true;if(e.touches[0])seek(e.touches[0].clientX)},{passive:true});timeline.addEventListener('touchmove',function(e){if(dragging&&e.touches[0])seek(e.touches[0].clientX)},{passive:true});window.addEventListener('touchend',function(){dragging=false});
document.addEventListener('click',function(){if(!interacted){interacted=true;if(audio.paused){autoplayNext=true;audio.play().then(setPause).catch(function(){})}}player.classList.add('ss-audio-collapsed');volumeWrap.classList.remove('open')});document.getElementById('ssAudioMain').addEventListener('click',function(e){e.stopPropagation()});applyVolume();})();
</script>
